<!doctype html>
<meta charset="utf-8">
<title>Trademate Story – Broker-Umfrage</title>
<link rel="stylesheet" href="_base.css">
<style>
  /* 1080x1920. Oben und unten bleiben rund 250 px frei, damit weder der
     Instagram-Header noch die Antwortleiste ueber den Inhalt laufen.
     Die Antwortleiste sitzt ganz unten - der Hinweis darueber zeigt darauf. */
  .buehne { width: 1080px; height: 1920px; }
  .logo { position: absolute; left: 96px; top: 296px; width: 320px; }

  .augenbraue {
    position: absolute; left: 100px; top: 420px;
    color: var(--gruen); font-size: 30px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .headline { position: absolute; left: 92px; top: 476px; width: 900px; font-size: 104px; }

  .liste { position: absolute; left: 96px; top: 872px; width: 888px; }
  .zeile {
    display: flex; align-items: center; gap: 28px;
    height: 112px; padding: 0 36px; margin-bottom: 22px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 42px; font-weight: 600; letter-spacing: -0.02em; color: #eef0f3;
  }
  /* Der leere Kreis liest sich wie ein Auswahlfeld - ohne einen echten
     Poll-Sticker vorzutaeuschen, den die API nicht setzen kann. */
  .kreis {
    width: 34px; height: 34px; flex: none;
    border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.35);
  }
  .zeile.offen {
    background: rgba(0, 230, 115, 0.08);
    border-color: rgba(0, 230, 115, 0.4);
    color: #d9fbe9;
  }
  .zeile.offen .kreis { border-color: var(--gruen); }
  .zeile.offen b { color: var(--gruen); font-weight: 700; }

  .hinweis {
    position: absolute; left: 100px; top: 1596px; width: 880px;
    color: #8b9098; font-size: 32px; font-weight: 500; letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .hinweis b { color: #eef0f3; font-weight: 600; }
</style>
<div class="buehne">
  <img class="logo" src="../images/brand/logo.png" alt="Trademate">

  <div class="augenbraue">Your call</div>
  <div class="headline">Which broker<br>should we<br>import next?</div>

  <div class="liste">
    <div class="zeile"><span class="kreis"></span>Interactive Brokers</div>
    <div class="zeile"><span class="kreis"></span>MetaTrader 5</div>
    <div class="zeile"><span class="kreis"></span>Trade Republic</div>
    <div class="zeile"><span class="kreis"></span>Tradovate</div>
    <div class="zeile offen"><span class="kreis"></span><span><b>Not listed?</b> Name it</span></div>
  </div>

  <div class="hinweis">
    Reply to this story with your pick &mdash; <b>the most-named one goes to the top of the list.</b>
  </div>
</div>
