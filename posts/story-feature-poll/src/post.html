<html><head><meta charset="utf-8"><title>Trademate — Major update poll</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{background:#000;overflow:hidden;}
  body{font-family:'Inter Tight','Inter',sans-serif;color:#fff;}
  #stage{position:relative;overflow:hidden;
    background:
      radial-gradient(120% 80% at 18% 6%, #2a2e33 0%, rgba(42,46,51,0) 55%),
      radial-gradient(100% 60% at 90% 96%, #1b2b23 0%, rgba(27,43,35,0) 60%),

  body.sq #stage{width:1080px;height:1080px;padding:92px 96px;}
  body.st #stage{width:1080px;height:1920px;padding:120px 88px;}
  #grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;background:url('grain.png');background-size:256px;pointer-events:none;}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 75% at 50% 42%, rgba(0,0,0,0) 46%, rgba(0,0,0,.42) 100%);}

  .logo{display:block;width:300px;}
  body.sq .logo{width:222px;}
  body.st .logo{margin:0 auto;}
  .eyebrow{font-family:'Inter';font-size:22px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#7e868d;margin-top:70px;}
  body.st .eyebrow{text-align:center;margin-top:110px;}
  .hl{font-weight:800;font-size:82px;line-height:1.0;letter-spacing:-.035em;margin-top:22px;
    background:linear-gradient(178deg,#ffffff 12%,#b9bfc5 96%);-webkit-background-clip:text;background-clip:text;color:transparent;
    padding-bottom:.12em;margin-bottom:-.12em;}
  body.st .hl{font-size:98px;text-align:center;}
  .sub{font-family:'Inter';font-size:29px;font-weight:500;color:#8a9199;line-height:1.4;margin-top:26px;letter-spacing:-.005em;max-width:860px;}
  body.st .sub{text-align:center;margin:26px auto 0;font-size:32px;}

  .card{background:linear-gradient(160deg,#17191c,#0e1012);border:1px solid rgba(255,255,255,.075);border-radius:32px;
    box-shadow:0 34px 70px rgba(0,0,0,.5);padding:40px 44px;}
  .tag{display:inline-flex;align-items:center;gap:12px;font-family:'Inter';font-size:23px;font-weight:700;letter-spacing:-.01em;
    padding:12px 22px;border-radius:100px;background:#1FDD7F;color:#04150c;}
  .tag.b{background:#dfe3e7;color:#0b0c0e;}
  .tag.r{background:#C62A30;color:#fff;}
  .foot{position:absolute;left:96px;right:96px;bottom:70px;display:flex;align-items:center;justify-content:space-between;
    font-family:'Inter';font-size:22px;font-weight:600;color:#5d646b;letter-spacing:.02em;}
  .g{color:#1FDD7F;} .r{color:#DC3A40;}

  /* two-column compare */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:52px;}
  .col{padding:8px 40px 4px 0;}
  .col+.col{border-left:1px solid rgba(255,255,255,.08);padding-left:40px;padding-right:0;}
  .col h3{font-size:40px;font-weight:800;letter-spacing:-.03em;margin-bottom:22px;}
  .col li{list-style:none;font-family:'Inter';font-size:25px;font-weight:500;color:#aab1b8;line-height:1.35;padding:13px 0 13px 34px;position:relative;

  .col li:before{content:'';position:absolute;left:0;top:26px;width:12px;height:12px;border-radius:50%;background:#1FDD7F;}
  .col.s li:before{background:#8ea0ff;}

  /* bars */
  .stat{margin-top:6px;}
  .stat+.stat{margin-top:30px;}
  .stat .k{display:flex;justify-content:space-between;font-family:'Inter';font-size:25px;font-weight:600;color:#c8ced4;}
  .stat .k b{font-family:'Inter Tight';font-size:36px;font-weight:800;letter-spacing:-.03em;color:#fff;}
  .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:14px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#12995a,#1FDD7F);}
  .bar.r i{background:linear-gradient(90deg,#7d1c20,#C62A30);}

  .big{font-size:150px;font-weight:800;letter-spacing:-.05em;line-height:1;color:#fff;}
  .big small{font-size:44px;letter-spacing:-.02em;color:#8a9199;font-weight:700;margin-left:14px;}

  /* result table */

  .tbl div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(255,255,255,.07);padding:14px 0;}

  .tbl b{font-size:36px;font-weight:800;letter-spacing:-.03em;}
  .hdr{display:flex;align-items:center;justify-content:space-between;}
  .hdr .t{font-family:'Inter';font-size:25px;font-weight:600;color:#c8ced4;}
  .hdr .m{font-family:'Inter';font-size:20px;font-weight:600;color:#5d646b;letter-spacing:.08em;text-transform:uppercase;}

  .opt{display:flex;align-items:center;gap:30px;padding:42px 44px;}
  .opt+.opt{margin-top:26px;}
  .opt .l{width:92px;height:92px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;

  .opt.b .l{background:#8ea0ff;color:#0b0e1c;}
  .opt h3{font-size:46px;font-weight:800;letter-spacing:-.03em;}
  .opt p{font-family:'Inter';font-size:26px;font-weight:500;color:#8a9199;line-height:1.35;margin-top:8px;}

  .zone{position:absolute;left:88px;right:88px;bottom:150px;height:330px;border-radius:32px;}
  .zone.guide{border:3px dashed rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
  .zone.guide .a{font-family:'Inter';font-size:26px;font-weight:700;color:#8a9199;letter-spacing:.12em;text-transform:uppercase;}
  .zone.guide .b{font-family:'Inter';font-size:24px;font-weight:500;color:#5d646b;}

  body[data-slide="3"] .stat+.stat{margin-top:40px;}
  body[data-slide="3"] .bar{height:13px;margin-top:18px;}
  body[data-slide="3"] .stat .k{font-size:27px;} body[data-slide="3"] .stat .k b{font-size:40px;}
  body[data-slide="4"] .card{margin-top:44px !important;padding:56px 56px;}
  body[data-slide="4"] .big{font-size:190px;}

  body[data-slide="7"] .opt{padding:44px 48px;} body[data-slide="7"] .opt h3{font-size:52px;} body[data-slide="7"] .opt p{font-size:28px;}
  body[data-slide="7"] .opt .l{width:104px;height:104px;font-size:50px;}
  body.st .opt{padding:54px 48px;} body.st .opt h3{font-size:52px;} body.st .opt p{font-size:29px;} body.st .opt .l{width:104px;height:104px;font-size:50px;}
  body[data-lang="de"][data-slide="3"] .hl, body[data-lang="de"][data-slide="4"] .hl{font-size:68px !important;}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin-top:14px;}

  .rows>div b{font-size:34px;font-weight:800;letter-spacing:-.03em;}
  .rows>div.hi{background:linear-gradient(90deg,rgba(31,221,127,.12),rgba(31,221,127,0));margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:12px;border-bottom-color:transparent;}
  .rows.one{grid-template-columns:1fr;gap:0;}
  .rows.one>div{padding:8px 0;} .rows.one>div span{width:190px;font-size:24px;} .rows.one>div b{font-size:30px;width:130px;text-align:right;}
  .rows.one>div em{font-style:normal;font-family:'Inter';font-size:22px;font-weight:600;color:#5d646b;flex:1;padding-left:20px;}
  .rows.one>div.off em{color:#DC3A40;} .rows.one>div.off span{color:#fff;}
  .rows .net{grid-column:1/-1;border-bottom:none;padding-top:14px;margin-top:2px;border-top:1px solid rgba(255,255,255,.14);}
  .rows .net span{font-size:27px;color:#fff;} .rows .net b{font-size:44px;}
  .rows .net.alt{padding-top:4px;margin-top:0;border-top:none;} .rows .net.alt span{font-size:22px;color:#8a9199;} .rows .net.alt b{font-size:30px;}
  .rows.one>div em i{font-style:normal;color:#8a9199;font-weight:500;}
  body[data-slide="day"] .hl, body[data-slide="swing"] .hl{font-size:80px;}
  body[data-slide="day"] .sub, body[data-slide="swing"] .sub{font-size:30px;max-width:880px;}
  body[data-slide="swing"] .sub{font-size:28px;margin-top:20px;}
  .disc{position:absolute;left:88px;right:88px;bottom:70px;text-align:center;font-family:'Inter';font-size:19px;font-weight:500;color:#5d646b;line-height:1.45;}
</style></head>

function candles(){ // deterministic little 5m chart for slide 6
  let x=0,p=1.0850,out=[],seed=7;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let i=0;i<34;i++){const o=p;const c=o+(rnd()-0.47)*0.0012+(i>12&&i<26?0.00035:0);const h=Math.max(o,c)+rnd()*0.0006;const l=Math.min(o,c)-rnd()*0.0006;out.push({o,c,h,l});p=c;}
  const min=Math.min(...out.map(k=>k.l)),max=Math.max(...out.map(k=>k.h));
  const W=880,H=300,pad=10,sx=W/out.length,y=v=>pad+(max-v)/(max-min)*(H-2*pad);
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  [0.25,0.5,0.75].forEach(f=>s+='<line x1="0" x2="'+W+'" y1="'+(H*f)+'" y2="'+(H*f)+'" stroke="rgba(255,255,255,.06)"/>');
  out.forEach((k,i)=>{const cx=i*sx+sx/2,up=k.c>=k.o,col=up?'#1FDD7F':'#DC3A40';
    s+='<line x1="'+cx+'" x2="'+cx+'" y1="'+y(k.h)+'" y2="'+y(k.l)+'" stroke="'+col+'" stroke-width="2"/>';
    s+='<rect x="'+(cx-sx*0.32)+'" y="'+Math.min(y(k.o),y(k.c))+'" width="'+(sx*0.64)+'" height="'+Math.max(2,Math.abs(y(k.o)-y(k.c)))+'" rx="1.5" fill="'+col+'"/>';});
  const ei=12,xi=25, ex=ei*sx+sx/2, xx=xi*sx+sx/2, ey=y(out[ei].c), xy=y(out[xi].c);
  s+='<line x1="'+ex+'" x2="'+xx+'" y1="'+ey+'" y2="'+ey+'" stroke="#8ea0ff" stroke-dasharray="6 6" stroke-width="2"/>';
  [[ex,ey,C.ent],[xx,xy,C.ex]].forEach(([px,py,l])=>{s+='<circle cx="'+px+'" cy="'+py+'" r="10" fill="#8ea0ff" stroke="#0e1012" stroke-width="4"/>';
    s+='<text x="'+(px+16)+'" y="'+(py-16)+'" font-family="Inter" font-size="20" font-weight="700" fill="#c8ced4">'+l+'</text>';});
  return s+'</svg>';
}

function runningPnl(){
  const pts=[['09:00',0],['10:00',490],['11:00',370],['12:00',-40],['13:00',-135],['14:00',-75],['15:00',120],['16:00',35]];
  const W=800,H=330,padL=44,padR=70,top=54,bot=54,min=-230,max=560;
  const x=i=>padL+i*(W-padL-padR)/(pts.length-1), y=v=>top+(max-v)/(max-min)*(H-top-bot);
  let d=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p[1])).join(' ');
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1FDD7F" stop-opacity=".22"/><stop offset="1" stop-color="#1FDD7F" stop-opacity="0"/></linearGradient></defs>';
  s+='<line x1="0" x2="'+W+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="rgba(255,255,255,.16)" stroke-dasharray="4 6"/>';
  s+='<path d="'+d+' L'+x(pts.length-1)+' '+y(0)+' L'+x(0)+' '+y(0)+'Z" fill="url(#gA)"/>';
  s+='<path d="'+d+'" fill="none" stroke="#e6e9ec" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
  // give-back segment in red
  s+='<path d="M'+x(1)+' '+y(490)+' L'+x(2)+' '+y(370)+' L'+x(3)+' '+y(-40)+' L'+x(4)+' '+y(-135)+'" fill="none" stroke="#DC3A40" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p,i)=>s+='<text x="'+x(i)+'" y="'+(H-14)+'" text-anchor="middle" font-family="Inter" font-size="20" font-weight="600" fill="#7e868d">'+p[0]+'</text>');
  const mark=(i,v,l,col,dy,side)=>{s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="9" fill="'+col+'" stroke="#0e1012" stroke-width="4"/>';
    if(side){s+='<text x="'+(x(i)+18)+'" y="'+(y(v)+10)+'" font-family="Inter Tight" font-size="27" font-weight="800" fill="'+col+'">'+(v>=0?'+':'−')+'$'+Math.abs(v)+'</text>';return;}
    s+='<text x="'+x(i)+'" y="'+(y(v)+dy)+'" text-anchor="middle" font-family="Inter Tight" font-size="27" font-weight="800" fill="'+col+'">'+(v>=0?'+':'−')+'$'+Math.abs(v)+'</text>';
    s+='<text x="'+x(i)+'" y="'+(y(v)+dy+(dy<0?-28:26))+'" text-anchor="middle" font-family="Inter" font-size="18" font-weight="600" fill="#7e868d" letter-spacing="1">'+l.toUpperCase()+'</text>';};
  mark(1,490,C.dayHi,'#1FDD7F',-22); mark(4,-135,'','#DC3A40',0,true); mark(7,35,C.dayCl,'#e6e9ec',-22);
  return s+'</svg>';
}
function hourBars(){
  const d=[['09',310],['10',180],['11',-120],['12',-410],['13',-95],['14',60],['15',520],['16',640]];
  const W=880,H=350,base=190,sc=0.22,bw=64,gap=(W-8*bw)/8;
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="0" x2="'+W+'" y1="'+base+'" y2="'+base+'" stroke="rgba(255,255,255,.14)"/>';
  d.forEach(([h,v],i)=>{const x=gap/2+i*(bw+gap),hh=Math.abs(v)*sc,y=v>0?base-hh:base,col=v>0?'#1FDD7F':'#DC3A40';
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" rx="6" fill="'+col+'" opacity="'+(h==='12'||h==='16'?1:.55)+'"/>';
    s+='<text x="'+(x+bw/2)+'" y="'+(v>0?y-14:y+hh+30)+'" text-anchor="middle" font-family="Inter Tight" font-size="24" font-weight="800" fill="'+col+'">'+(v>0?'+':'-')+'$'+Math.abs(v)+'</text>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-family="Inter" font-size="21" font-weight="600" fill="#7e868d">'+h+':00</text>';});
  return s+'</svg>';
}
