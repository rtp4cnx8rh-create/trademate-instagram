# Ablegen unter: .github/workflows/publish.yml
#
# Zieltermin ist 18:00 Berliner Zeit: im Sommer 16:00 UTC, im Winter 17:00 UTC.
#
# GitHub-Cron ist in der Praxis deutlich unpuenktlicher als dokumentiert -
# gemessen wurden hier 2 bis 4,5 Stunden Verspaetung. Deshalb zwei Dinge:
#   1. publish.py prueft "Stunde >= Zielstunde am selben Tag", nicht mehr
#      auf die exakte Stunde. Sonst verschluckt ein verspaeteter Lauf den Post.
#   2. Zusaetzliche Cron-Zeiten als Netz. Der erste Lauf, der es schafft,
#      postet; alle spaeteren finden den Tag in published.json und tun nichts.
# Nach 21:00 UTC wird nicht mehr gestartet - danach ist in Berlin bereits
# der Folgetag, und das Datum wuerde nicht mehr passen.
#
# Stories stehen frueher am Tag an (12:00 Berlin) und haben deshalb zwei
# eigene Cron-Zeiten. Verpasst der Lauf sie, holen die spaeteren Laeufe die
# Story nach - faellig ist alles ab der Zielstunde am selben Tag.

name: Instagram Daily Post

on:
  schedule:
    - cron: "0 10 * * *"   # 12:00 Berlin (Sommerzeit) - Story-Termin
    - cron: "0 11 * * *"   # 12:00 Berlin (Winterzeit) - Story-Termin
    - cron: "0 16 * * *"   # 18:00 Berlin (Sommerzeit) - Zieltermin
    - cron: "0 17 * * *"   # 18:00 Berlin (Winterzeit) - Zieltermin
    - cron: "0 18 * * *"   # Netz, falls die Zieltermine verspaetet ausfallen
    - cron: "0 19 * * *"   # Netz
    - cron: "0 20 * * *"   # Netz
    - cron: "0 21 * * *"   # Netz, letzter Versuch vor Mitternacht Berlin
  workflow_dispatch:        # erlaubt manuelles Ausloesen per Knopf
    inputs:
      force_date:
        description: "Bestimmten Tag nachholen (YYYY-MM-DD), leer = normaler Lauf"
        required: false
      dry_run:
        description: "Nur anzeigen, nichts posten"
        type: boolean
        default: false
      check_only:
        description: "Nur Token und Kontozugriff pruefen (nichts posten)"
        type: boolean
        default: false

# Das Skript schreibt published.json zurueck ins Repo, damit ein
# Doppelpost auch bei einem Wiederholungslauf ausgeschlossen ist.
permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post veroeffentlichen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Leer lassen bei Business Login for Instagram (Standard).
          # Bei Facebook Login for Business: graph.facebook.com
          IG_API_HOST: ${{ secrets.IG_API_HOST || 'graph.instagram.com' }}
        run: |
          # Laenge des Secrets ausgeben, ohne es preiszugeben.
          # Ein Instagram-Token ist rund 190 Zeichen lang. Weicht die Zahl
          # stark ab oder ist sie 0, stimmt etwas mit dem Secret nicht.
          echo "Laenge IG_ACCESS_TOKEN: ${#IG_ACCESS_TOKEN}"
          echo "Laenge IG_USER_ID:      ${#IG_USER_ID}"
          case "$IG_ACCESS_TOKEN" in
            *\'*|*\"*) echo "WARNUNG: Der Token enthaelt Anführungszeichen. Die gehoeren nicht ins Secret." ;;
          esac

          ARGS=""
          if [ "${{ inputs.check_only }}" = "true" ]; then
            ARGS="--check"
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "${{ inputs.force_date }}" ]; then
              ARGS="$ARGS --force ${{ inputs.force_date }}"
            fi
          fi
          python3 publish.py $ARGS

      - name: Stand zurueckschreiben
        if: ${{ inputs.dry_run != true }}
        run: |
          # Wurde nichts veroeffentlicht, existiert die Datei gar nicht.
          if [ ! -f published.json ]; then
            echo "Keine published.json - nichts zu committen."
            exit 0
          fi

          git config user.name  "trademate-bot"
          git config user.email "bot@trademate-app.com"
          git add published.json

          # Unveraendert? Dann ebenfalls nichts zu tun.
          if git diff --cached --quiet; then
            echo "published.json unveraendert - kein Commit noetig."
            exit 0
          fi

          git commit -m "published: $(date -u +%Y-%m-%d)"
          git push
